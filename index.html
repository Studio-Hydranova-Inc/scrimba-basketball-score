<!DOCTYPE html>
<html lang="en">
    <header>
    <title>Basketball Score game</title>
    <link rel="stylesheet" href="styles.css">
    </header>
    <body>
        <section>
            <div class="container">
                <div class="column">
                    <h2 class="heading">Team 1</h2>
                    <div class="count">
                        <p id="home">0</p>
                    </div>
                    <div class="buttons">
                        <button id="home-one" onclick="homeOne()">+1</button>
                        <button id="home-two" onclick="homeTwo()">+2</button>
                        <button id="home-three" onclick="homeThree()">+3</button>
                    </div>
                </div>
                <div class="column">
                    <h2 class="heading">Team 2</h2>
                    <div class="count">
                        <p id="guest">0</p>
                    </div>
                    <div class="buttons">
                        <button id="guest-one" onclick="guestOne()">+1</button>
                        <button id="guest-two" onclick="guestTwo()">+2</button>
                        <button id="guest-three" onclick="guestThree()">+3</button>
                    </div>
                </div>
            </div>
        </section>
        <script src="index.js"></script>
    </body>
</html>
